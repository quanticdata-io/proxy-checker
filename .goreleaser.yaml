version: 2
project_name: proxy-checker

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: proxy-checker
    main: ./cmd/proxy-checker
    binary: proxy-checker
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/quanticdata-io/proxy-checker/pkg/checker.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  github:
    owner: quanticdata-io
    name: proxy-checker
  draft: true
