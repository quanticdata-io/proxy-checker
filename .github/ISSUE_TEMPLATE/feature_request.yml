name: Feature request
description: Suggest a check, an output format or an option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to find out about your proxies?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Flags, output fields or behaviour you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
