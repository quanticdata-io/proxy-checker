version: "2"
linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G402 # InsecureSkipVerify is an explicit opt-in flag (--insecure)
        - G107 # URLs come from the user by design
        - G304 # reading the proxy list file the user names is the point
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      - path: internal/testutil/
        linters: [gosec]
formatters:
  enable:
    - gofmt
